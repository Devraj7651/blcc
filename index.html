<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCC Home Work - Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hide {
            display: none;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Animation for alerts */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        .alert-show {
            animation: slideIn 0.3s forwards;
        }
        .alert-hide {
            animation: fadeOut 0.5s forwards;
        }
        /* Image preview */
        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
        }
        /* Password field styling */
        .password-field {
            font-family: monospace;
            background-color: #f9fafb;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            font-size: 0.875rem;
        }
        /* Custom gradient background */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        /* Card hover effects */
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        /* Hindi font support */
        .hindi-text {
            font-family: 'Nirmala UI', 'Segoe UI', sans-serif;
        }
        /* Blocked user styling */
        .user-blocked {
            opacity: 0.7;
            background-color: #fee2e2;
            border: 1px solid #fecaca;
        }
        /* Video class styling */
        .video-container {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .video-controls button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            cursor: pointer;
        }
        .video-controls button.active {
            background: rgba(255, 255, 255, 0.4);
        }
        .video-controls button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .participant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .participant-card {
            background: #f3f4f6;
            border-radius: 8px;
            padding: 10px;
            position: relative;
        }
        .participant-video {
            width: 100%;
            height: 150px;
            background: #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .participant-name {
            margin-top: 5px;
            font-weight: 500;
            text-align: center;
        }
        .participant-controls {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 5px;
        }
        .digital-board {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            resize: none;
            font-family: 'Nirmala UI', 'Segoe UI', sans-serif;
        }
        .digital-board-view {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            font-size: 16px;
            background-color: #f9fafb;
            overflow-y: auto;
            font-family: 'Nirmala UI', 'Segoe UI', sans-serif;
        }
        .speech-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
            margin-left: 5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .speech-active {
            background-color: #22c55e;
        }
        .video-class-card {
            transition: all 0.3s ease;
        }
        .video-class-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
        }
        .status-scheduled {
            background-color: #dbeafe;
            color: #1e40af;
        }
        .status-ongoing {
            background-color: #dcfce7;
            color: #166534;
        }
        .status-completed {
            background-color: #f3f4f6;
            color: #374151;
        }
        .permission-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }
        .permission-btn.active {
            background-color: #dcfce7;
            color: #166534;
        }
        .permission-btn.inactive {
            background-color: #fecaca;
            color: #b91c1c;
        }
        /* Quiz specific styles */
        .quiz-option {
            display: block;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .quiz-option:hover {
            background-color: #f0f0f0;
        }
        .quiz-option.selected {
            background-color: #d1ecf1;
            border-color: #0c5460;
        }
        .quiz-option.correct {
            background-color: #d4edda;
            border-color: #28a745;
        }
        .quiz-option.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
        }
        .quiz-question {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .quiz-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .quiz-stat-box {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background-color: #f8f9fa;
            margin: 0 5px;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100">
    <header class="bg-white shadow-sm border-b sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="font-bold text-xl flex items-center">
                <i class="fas fa-book-reader mr-2 text-blue-600"></i> BLCC Home Work
            </div>
            <div id="nav" class="flex items-center gap-2"></div>
        </div>
    </header>

    <!-- Alert Container -->
    <div id="alert-container" class="fixed top-4 right-4 z-50 space-y-2 max-w-sm"></div>

    <main id="app" class="max-w-6xl mx-auto p-4"></main>

    <script>
        // Simple single-file app using localStorage as DB
        const DBKEY = 'blcc_hw_db_v6';
        const SESSION = 'blcc_hw_session_v6';

        const seed = {
            users: [
                {id:'u-admin', name:'Admin', email:'admin@school.com', username:'admin', password:'admin123', role:'admin', school:'ABC Public School', rollPrefix:'', isBlocked: false, createdAt: Date.now()},
                {id:'u-teacher', name:'Teacher One', email:'teacher@school.com', username:'teacher', password:'teach123', role:'teacher', school:'ABC Public School', rollPrefix:'', isBlocked: false, createdAt: Date.now()},
                {id:'u-student1', name:'Student One', email:'s1@school.com', username:'s1', password:'stud123', role:'student', school:'ABC Public School', rollNo:'101', isBlocked: false, createdAt: Date.now()},
                {id:'u-student2', name:'Student Two', email:'s2@school.com', username:'s2', password:'stud123', role:'student', school:'ABC Public School', rollNo:'102', isBlocked: false, createdAt: Date.now()},
                {id:'u-abhi', name:'ABHI', email:'abhi@school.com', username:'abhi', password:'Abhi@7651', role:'admin', school:'ABC Public School', isBlocked: false, createdAt: Date.now()}
            ],
            homeworks: [
                {
                    id: 'hw-sample',
                    title: 'नमूना गणित का होमवर्क',
                    desc: 'पृष्ठ 34 के सभी प्रश्न हल करें',
                    assignedBy: 'u-teacher',
                    school: 'ABC Public School',
                    rollNo: '',
                    dueDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    createdAt: Date.now() - 2 * 24 * 60 * 60 * 1000,
                    image: null,
                    submissions: [],
                    status: 'assigned'
                }
            ],
            // New data structure for video classes
            videoClasses: [
                {
                    id: 'vc-1',
                    title: 'गणित की कक्षा',
                    teacherId: 'u-teacher',
                    school: 'ABC Public School',
                    scheduledTime: new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString(),
                    duration: 60,
                    status: 'scheduled',
                    participants: [],
                    digitalBoard: '',
                    createdAt: Date.now()
                }
            ],
            // New data structure for quizzes
            quizzes: [
                {
                    id: 'qz-1',
                    title: 'गणित क्विज - अध्याय 1',
                    description: 'गणित के मूलभूत प्रश्न',
                    teacherId: 'u-teacher',
                    school: 'ABC Public School',
                    rollNo: '',
                    dueDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    createdAt: Date.now() - 2 * 24 * 60 * 60 * 1000,
                    questions: [
                        {
                            id: 'q1',
                            question: '2 + 2 क्या होता है?',
                            options: ['3', '4', '5', '6'],
                            correctAnswer: 1
                        },
                        {
                            id: 'q2',
                            question: '10 × 5 क्या होता है?',
                            options: ['25', '50', '75', '100'],
                            correctAnswer: 1
                        }
                    ],
                    submissions: []
                }
            ],
            quizSubmissions: []
        };

        // Utility functions
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alert-container');
            const alertId = 'alert-' + Date.now();
            const alertEl = document.createElement('div');
            alertEl.id = alertId;
            alertEl.className = `p-4 rounded-lg shadow-lg alert-show ${type === 'error' ? 'bg-red-100 text-red-700 border border-red-300' : type === 'success' ? 'bg-green-100 text-green-700 border border-green-300' : 'bg-blue-100 text-blue-700 border border-blue-300'}`;
            alertEl.innerHTML = `
                <div class="flex justify-between items-center">
                    <div><i class="fas ${type === 'error' ? 'fa-exclamation-circle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'} mr-2"></i> ${message}</div>
                    <button onclick="document.getElementById('${alertId}').classList.add('alert-hide'); setTimeout(() => document.getElementById('${alertId}').remove(), 500)" class="text-lg">×</button>
                </div>
            `;
            alertContainer.appendChild(alertEl);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                if (document.getElementById(alertId)) {
                    document.getElementById(alertId).classList.add('alert-hide');
                    setTimeout(() => {
                        if (document.getElementById(alertId)) document.getElementById(alertId).remove();
                    }, 500);
                }
            }, 5000);
        }

        // Convert image to base64
        function convertImageToBase64(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                callback(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        const DB = {
            load() { 
                const raw = localStorage.getItem(DBKEY); 
                if (!raw) { 
                    localStorage.setItem(DBKEY, JSON.stringify(seed)); 
                    return structuredClone(seed);
                } 
                try {
                    return JSON.parse(raw);
                } catch (e) { 
                    localStorage.setItem(DBKEY, JSON.stringify(seed)); 
                    return structuredClone(seed);
                } 
            },
            save(data) { localStorage.setItem(DBKEY, JSON.stringify(data)); }
        };

        function uid(p = 'id') { return p + '_' + Math.random().toString(36).slice(2, 9); }

        const Auth = {
            current() { 
                const raw = localStorage.getItem(SESSION); 
                return raw ? JSON.parse(raw) : null; 
            },
            login(username, password) { 
                const db = DB.load(); 
                // Make login case-insensitive for username/email
                const user = db.users.find(u => 
                    (u.username.toLowerCase() === username.toLowerCase() || u.email.toLowerCase() === username.toLowerCase()) && 
                    u.password === password
                ); 
                if (!user) throw new Error('गलत यूज़रनेम/पासवर्ड'); 
                if (user.isBlocked) throw new Error('आपका अकाउंट ब्लॉक किया गया है। एडमिन से संपर्क करें।');
                localStorage.setItem(SESSION, JSON.stringify({id: user.id, username: user.username}));
                showAlert(`स्वागतम ${user.name}`, 'success');
                return user;
            },
            logout() { 
                localStorage.removeItem(SESSION); 
                render(); 
            },
            me() { 
                const s = Auth.current(); 
                if (!s) return null; 
                return DB.load().users.find(u => u.id === s.id) || null; 
            }
        };

        const App = {
            init() { 
                // Initialize database with seed data if empty
                DB.load();
                render(); 
            },

            register(form) { 
                const db = DB.load(); 
                const formData = new FormData(form);
                const name = formData.get('name');
                const email = formData.get('email');
                const username = formData.get('username');
                const password = formData.get('password');
                const role = formData.get('role');
                const school = formData.get('school');
                const rollNo = formData.get('rollNo');
                
                if (db.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                    throw new Error('यूज़रनेम पहले से मौजूद है');
                }
                if (db.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                    throw new Error('ईमेल पहले से मौजूद है'); 
                }
                
                const user = { 
                    id: uid('u'), 
                    name: name,
                    email: email,
                    username: username,
                    password: password,
                    role: role, 
                    school: school || '', 
                    rollNo: role === 'student' ? (rollNo || '') : '', 
                    isBlocked: false,
                    createdAt: Date.now() 
                }; 
                
                db.users.push(user); 
                DB.save(db); 
                
                // Auto login after registration
                Auth.login(username, password);
                render();
            },

            createHomework(form, imageData) { 
                const db = DB.load(); 
                const formData = new FormData(form);
                const title = formData.get('title');
                const desc = formData.get('desc');
                const school = formData.get('school');
                const rollNo = formData.get('rollNo');
                const dueDate = formData.get('dueDate');
                
                const me = Auth.me(); 
                if (!me || me.role !== 'teacher') throw new Error('अनुमति नहीं है'); 
                
                const hw = { 
                    id: uid('hw'), 
                    title: title,
                    desc: desc,
                    assignedBy: me.id, 
                    school: school || me.school || '', 
                    rollNo: rollNo || '', 
                    dueDate: dueDate || null, 
                    createdAt: Date.now(), 
                    image: imageData || null,
                    submissions: [], 
                    status: 'assigned' 
                }; 
                
                db.homeworks.unshift(hw); 
                DB.save(db); 
                showAlert('होमवर्क सफलतापूर्वक बनाया गया', 'success');
                renderTeacherDashboard(); 
            },

            submitHomework(hwId, form, imageData) { 
                const db = DB.load(); 
                const formData = new FormData(form);
                const answer = formData.get('answer');
                
                const me = Auth.me(); 
                if (!me || me.role !== 'student') throw new Error('अनुमति नहीं है'); 
                
                const hw = db.homeworks.find(h => h.id === hwId); 
                if (!hw) throw new Error('होमवर्क नहीं मिला'); 
                
                if (!answer.trim()) throw new Error('कृपया उत्तर दर्ज करें');
                
                const sIndex = hw.submissions.findIndex(s => s.studentId === me.id); 
                const submission = { 
                    studentId: me.id, 
                    answer: answer, 
                    image: imageData || null,
                    submitAt: Date.now(), 
                    marks: null, 
                    feedback: null 
                }; 
                
                if (sIndex > -1) { 
                    hw.submissions[sIndex] = submission; 
                } else { 
                    hw.submissions.push(submission); 
                } 
                
                DB.save(db); 
                showAlert('होमवर्क सफलतापूर्वक जमा किया गया', 'success');
                renderStudentDashboard(); 
            },

            gradeSubmission(hwId, studentId, marks, feedback) { 
                const db = DB.load(); 
                const me = Auth.me(); 
                if (!me || me.role !== 'teacher') throw new Error('अनुमति नहीं है'); 
                
                const hw = db.homeworks.find(h => h.id === hwId); 
                if (!hw) return; 
                
                const s = hw.submissions.find(s => s.studentId === studentId); 
                if (!s) return; 
                
                s.marks = marks; 
                s.feedback = feedback; 
                DB.save(db); 
                showAlert('अंक सफलतापूर्वक सहेजे गए', 'success');
                viewHW(hwId); 
            },

            findHomeworksForStudent(student) { 
                const db = DB.load(); 
                return db.homeworks.filter(h => 
                    h.school === student.school && 
                    (!h.rollNo || h.rollNo.trim() === '' || h.rollNo === student.rollNo)
                ); 
            },

            findHomeworksForTeacher(teacher) { 
                const db = DB.load(); 
                return db.homeworks.filter(h => h.assignedBy === teacher.id); 
            },

            // Admin functions
            getAllUsers() {
                const db = DB.load();
                return db.users;
            },

            getUserProgress(studentId) {
                const db = DB.load();
                const student = db.users.find(u => u.id === studentId);
                if (!student || student.role !== 'student') return null;
                
                const allHomeworks = db.homeworks.filter(h => 
                    h.school === student.school && 
                    (!h.rollNo || h.rollNo.trim() === '' || h.rollNo === student.rollNo)
                );
                
                const submitted = allHomeworks.filter(h => 
                    h.submissions.some(s => s.studentId === studentId)
                );
                
                const graded = submitted.filter(h => {
                    const submission = h.submissions.find(s => s.studentId === studentId);
                    return submission.marks !== null;
                });
                
                const totalMarks = graded.reduce((sum, h) => {
                    const submission = h.submissions.find(s => s.studentId === studentId);
                    return sum + (submission.marks || 0);
                }, 0);
                
                const average = graded.length > 0 ? (totalMarks / graded.length).toFixed(2) : 0;
                
                return {
                    total: allHomeworks.length,
                    submitted: submitted.length,
                    graded: graded.length,
                    average: average
                };
            },

            // Block/Unblock user functions
            blockUser(userId) {
                const db = DB.load();
                const user = db.users.find(u => u.id === userId);
                if (!user) throw new Error('यूजर नहीं मिला');
                
                user.isBlocked = true;
                DB.save(db);
                showAlert(`यूजर ${user.name} को ब्लॉक कर दिया गया है`, 'success');
                return user;
            },

            unblockUser(userId) {
                const db = DB.load();
                const user = db.users.find(u => u.id === userId);
                if (!user) throw new Error('यूजर नहीं मिला');
                
                user.isBlocked = false;
                DB.save(db);
                showAlert(`यूजर ${user.name} को अनब्लॉक कर दिया गया है`, 'success');
                return user;
            },

            // Video class functions
            createVideoClass(form) {
                const db = DB.load();
                const me = Auth.me();
                if (!me || me.role !== 'teacher') throw new Error('अनुमति नहीं है');
                
                const formData = new FormData(form);
                const title = formData.get('title');
                const scheduledTime = formData.get('scheduledTime');
                const duration = formData.get('duration');
                
                const videoClass = {
                    id: uid('vc'),
                    title: title,
                    teacherId: me.id,
                    school: me.school || '',
                    scheduledTime: scheduledTime,
                    duration: parseInt(duration),
                    status: 'scheduled',
                    participants: [],
                    digitalBoard: '',
                    createdAt: Date.now()
                };
                
                db.videoClasses.unshift(videoClass);
                DB.save(db);
                showAlert('वीडियो क्लास सफलतापूर्वक बनाई गई', 'success');
                renderTeacherDashboard();
            },

            joinVideoClass(videoClassId) {
                const db = DB.load();
                const me = Auth.me();
                if (!me) throw new Error('लॉगिन आवश्यक है');
                
                const videoClass = db.videoClasses.find(vc => vc.id === videoClassId);
                if (!videoClass) throw new Error('वीडियो क्लास नहीं मिली');
                
                // Check if class is scheduled and update to ongoing if teacher is joining
                if (me.role === 'teacher' && videoClass.status === 'scheduled') {
                    videoClass.status = 'ongoing';
                }
                
                // Check if class has ended
                if (videoClass.status === 'completed') {
                    throw new Error('यह क्लास समाप्त हो चुकी है');
                }
                
                // Check if user is already a participant
                if (!videoClass.participants.some(p => p.userId === me.id)) {
                    videoClass.participants.push({
                        userId: me.id,
                        name: me.name,
                        role: me.role,
                        joinedAt: Date.now(),
                        audioEnabled: false,
                        videoEnabled: false,
                        canSpeak: me.role === 'teacher' // Only teacher can speak by default
                    });
                }
                
                DB.save(db);
                return videoClass;
            },

            updateParticipantPermission(videoClassId, userId, permissions) {
                const db = DB.load();
                const videoClass = db.videoClasses.find(vc => vc.id === videoClassId);
                if (!videoClass) return;
                
                const participant = videoClass.participants.find(p => p.userId === userId);
                if (participant) {
                    Object.assign(participant, permissions);
                    DB.save(db);
                }
            },

            // Digital board functions
            updateDigitalBoard(videoClassId, text) {
                const db = DB.load();
                const videoClass = db.videoClasses.find(vc => vc.id === videoClassId);
                if (videoClass) {
                    videoClass.digitalBoard = text;
                    DB.save(db);
                }
            },
            
            // End video class
            endVideoClass(videoClassId) {
                const db = DB.load();
                const videoClass = db.videoClasses.find(vc => vc.id === videoClassId);
                if (videoClass) {
                    videoClass.status = 'completed';
                    videoClass.endedAt = Date.now();
                    DB.save(db);
                    showAlert('वीडियो क्लास समाप्त की गई', 'success');
                }
            },

            // Quiz functions
            createQuiz(form) {
                const db = DB.load();
                const me = Auth.me();
                if (!me || me.role !== 'teacher') throw new Error('अनुमति नहीं है');
                
                const formData = new FormData(form);
                const title = formData.get('title');
                const description = formData.get('description');
                const school = formData.get('school');
                const rollNo = formData.get('rollNo');
                const dueDate = formData.get('dueDate');
                
                // Parse questions from form data
                const questions = [];
                let questionIndex = 0;
                
                while (formData.get(`questions[${questionIndex}][question]`)) {
                    const questionText = formData.get(`questions[${questionIndex}][question]`);
                    const options = [
                        formData.get(`questions[${questionIndex}][option1]`),
                        formData.get(`questions[${questionIndex}][option2]`),
                        formData.get(`questions[${questionIndex}][option3]`),
                        formData.get(`questions[${questionIndex}][option4]`)
                    ];
                    const correctAnswer = parseInt(formData.get(`questions[${questionIndex}][correctAnswer]`));
                    
                    questions.push({
                        id: uid('q'),
                        question: questionText,
                        options: options,
                        correctAnswer: correctAnswer
                    });
                    
                    questionIndex++;
                }
                
                if (questions.length === 0) {
                    throw new Error('कम से कम एक प्रश्न जोड़ें');
                }
                
                const quiz = {
                    id: uid('qz'),
                    title: title,
                    description: description,
                    teacherId: me.id,
                    school: school || me.school || '',
                    rollNo: rollNo || '',
                    dueDate: dueDate || null,
                    createdAt: Date.now(),
                    questions: questions,
                    submissions: []
                };
                
                db.quizzes.unshift(quiz);
                DB.save(db);
                showAlert('क्विज सफलतापूर्वक बनाई गई', 'success');
                renderTeacherDashboard();
            },

            submitQuiz(quizId, answers) {
                const db = DB.load();
                const me = Auth.me();
                if (!me || me.role !== 'student') throw new Error('अनुमति नहीं है');
                
                const quiz = db.quizzes.find(q => q.id === quizId);
                if (!quiz) throw new Error('क्विज नहीं मिली');
                
                // Calculate score
                let score = 0;
                quiz.questions.forEach((question, index) => {
                    if (answers[index] === question.correctAnswer) {
                        score++;
                    }
                });
                
                const percentage = (score / quiz.questions.length) * 100;
                
                const submission = {
                    id: uid('sub'),
                    studentId: me.id,
                    quizId: quizId,
                    answers: answers,
                    score: score,
                    total: quiz.questions.length,
                    percentage: percentage,
                    submittedAt: Date.now()
                };
                
                // Check if student already submitted
                const existingIndex = quiz.submissions.findIndex(s => s.studentId === me.id);
                if (existingIndex > -1) {
                    quiz.submissions[existingIndex] = submission;
                } else {
                    quiz.submissions.push(submission);
                }
                
                // Also store in quizSubmissions for easy access
                const globalSubmissionIndex = db.quizSubmissions.findIndex(s => s.studentId === me.id && s.quizId === quizId);
                if (globalSubmissionIndex > -1) {
                    db.quizSubmissions[globalSubmissionIndex] = submission;
                } else {
                    db.quizSubmissions.push(submission);
                }
                
                DB.save(db);
                return submission;
            },

            findQuizzesForStudent(student) {
                const db = DB.load();
                return db.quizzes.filter(q => 
                    q.school === student.school && 
                    (!q.rollNo || q.rollNo.trim() === '' || q.rollNo === student.rollNo)
                );
            },

            findQuizzesForTeacher(teacher) {
                const db = DB.load();
                return db.quizzes.filter(q => q.teacherId === teacher.id);
            },

            getQuizProgress(studentId) {
                const db = DB.load();
                const student = db.users.find(u => u.id === studentId);
                if (!student || student.role !== 'student') return null;
                
                const allQuizzes = db.quizzes.filter(q => 
                    q.school === student.school && 
                    (!q.rollNo || q.rollNo.trim() === '' || q.rollNo === student.rollNo)
                );
                
                const submitted = allQuizzes.filter(q => 
                    q.submissions.some(s => s.studentId === studentId)
                );
                
                const averageScore = submitted.length > 0 ? 
                    submitted.reduce((sum, q) => {
                        const submission = q.submissions.find(s => s.studentId === studentId);
                        return sum + submission.percentage;
                    }, 0) / submitted.length : 0;
                
                return {
                    total: allQuizzes.length,
                    submitted: submitted.length,
                    average: averageScore.toFixed(2)
                };
            }
        };

        function addQuestion() {
            const questionsContainer = document.getElementById('questionsContainer');

            const questionHtml = `

                            <option value="2">विकल्प 3</option>
                            <option value="3">विकल्प 4</option>

                </div>
            `;
            
            questionsContainer.insertAdjacentHTML('beforeend', questionHtml);
        }

        function removeQuestion(button) {
            if (document.getElementById('questionsContainer').children.length > 1) {
                button.closest('.question-item').remove();
                
                // Reindex questions
                const questions = document.querySelectorAll('.question-item');
                questions.forEach((question, index) => {
                    question.querySelector('.font-medium').textContent = `प्रश्न ${index + 1}`;
                    
                    const inputs = question.querySelectorAll('input, select');
                    inputs.forEach(input => {
                        const name = input.getAttribute('name');
                        if (name) {
                            input.setAttribute('name', name.replace(/\[\d+\]/, `[${index}]`));
                        }
                    });
                });
            } else {
                showAlert('कम से कम एक प्रश्न होना चाहिए', 'error');
            }
        }

        function initVideoRoom(videoClassId, isTeacher) {

            const toggleAudioBtn = document.getElementById('toggleAudio');

            if (toggleAudioBtn) {
                toggleAudioBtn.innerHTML = participant.audioEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
                toggleAudioBtn.classList.toggle('active', participant.audioEnabled);
            }
            
            if (toggleVideoBtn) {
                toggleVideoBtn.innerHTML = participant.videoEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
                toggleVideoBtn.classList.toggle('active', participant.videoEnabled);
            }
            
            // Toggle audio button
            if (toggleAudioBtn) {
                toggleAudioBtn.addEventListener('click', function() {
                    const db = DB.load();
                    const videoClass = db.videoClasses.find(vc => vc.id === videoClassId);
                    if (videoClass) {
                        const participant = videoClass.participants.find(p => p.userId === me.id);
                        if (participant) {
                            participant.audioEnabled = !participant.audioEnabled;
                            DB.save(db);
                            this.innerHTML = participant.audioEnabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
                            this.classList.toggle('active', participant.audioEnabled);
                        }

            // Toggle video button

                toggleVideoBtn.addEventListener('click', function() {
                    const db = DB.load();

                        const participant = videoClass.participants.find(p => p.userId === me.id);
                        if (participant) {
                            participant.videoEnabled = !participant.videoEnabled;
                            DB.save(db);
                            this.innerHTML = participant.videoEnabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';

            // Toggle speech recognition (for teachers)
            const toggleSpeechBtn = document.getElementById('toggleSpeech');
            if (toggleSpeechBtn) {

                    if (!window.speechRecognitionActive) {

        // Speech recognition functionality
        let recognition = null;
        window.speechRecognitionActive = false;

        function startSpeechRecognition(videoClassId) {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'hi-IN'; // Hindi language

                recognition.onresult = function(event) {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    // Update digital board
                    const digitalBoard = document.getElementById('digitalBoard');
                    if (digitalBoard) {
                        digitalBoard.value = finalTranscript + interimTranscript;
                        updateDigitalBoard(videoClassId, digitalBoard.value);
                    }
                };

                recognition.onerror = function(event) {
                    console.error('Speech recognition error', event.error);
                    stopSpeechRecognition();
                };

                recognition.start();
                window.speechRecognitionActive = true;
            } else {
                showAlert('आपका ब्राउज़र स्पीच रिकग्निशन का समर्थन नहीं करता है', 'error');
            }
        }

        function stopSpeechRecognition() {
            if (recognition) {
                recognition.stop();
            }
            window.speechRecognitionActive = false;
            
            const toggleSpeechBtn = document.getElementById('toggleSpeech');
            if (toggleSpeechBtn) {
                toggleSpeechBtn.innerHTML = '<i class="fas fa-microphone-alt"></i>';
                toggleSpeechBtn.classList.remove('active');
            }
            
            const speechStatus = document.getElementById('speechStatus');
            if (speechStatus) {
                speechStatus.classList.add('hidden');
            }
        }

                            `).join('')}
                        </div>

                            </button>
                            <button type="button" id="nextBtn" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700 transition-colors" onclick="nextQuestion()">

                            </button>
                            <button type="button" id="submitBtn" class="px-4 py-2 rounded bg-green-600 text-white hover:bg-green-700 transition-colors hide" onclick="submitQuiz('${quizId}')">
                                Submit <i class="fas fa-check ml-1"></i>

            // Initialize quiz
            initQuiz(quiz);

        function initQuiz(quiz) {
            let currentQuestion = 0;
            const totalQuestions = quiz.questions.length;
            const answers = Array(totalQuestions).fill(null);
            
            // Set up option selection
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove selected class from all options in this question
                    this.parentNode.querySelectorAll('.quiz-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // Add selected class to clicked option
                    this.classList.add('selected');
                    
                    // Get the input and mark it as checked
                    const input = this.querySelector('input');
                    input.checked = true;
                    
                    // Store the answer
                    const questionIndex = parseInt(input.name.replace('q', ''));
                    answers[questionIndex] = parseInt(input.value);
                });
            });
            
            // Set up navigation
            window.nextQuestion = function() {
                if (currentQuestion < totalQuestions - 1) {
                    document.getElementById(`question-${currentQuestion}`).classList.add('hide');
                    currentQuestion++;
                    document.getElementById(`question-${currentQuestion}`).classList.remove('hide');
                    document.getElementById('currentQuestion').textContent = currentQuestion + 1;
                    
                    // Show previous button
                    document.getElementById('prevBtn').classList.remove('hide');
                    
                    // Show submit button if last question
                    if (currentQuestion === totalQuestions - 1) {
                        document.getElementById('nextBtn').classList.add('hide');
                        document.getElementById('submitBtn').classList.remove('hide');
                    }
                }
            };
            
            window.prevQuestion = function() {
                if (currentQuestion > 0) {
                    document.getElementById(`question-${currentQuestion}`).classList.add('hide');
                    currentQuestion--;
                    document.getElementById(`question-${currentQuestion}`).classList.remove('hide');
                    document.getElementById('currentQuestion').textContent = currentQuestion + 1;
                    
                    // Hide previous button if first question
                    if (currentQuestion === 0) {
                        document.getElementById('prevBtn').classList.add('hide');
                    }
                    
                    // Show next button
                    document.getElementById('nextBtn').classList.remove('hide');
                    document.getElementById('submitBtn').classList.add('hide');
                }
            };
            
            window.submitQuiz = function(quizId) {
                // Check if all questions are answered
                if (answers.includes(null)) {
                    showAlert('कृपया सभी प्रश्नों के उत्तर दें', 'error');
                    return;
                }
                
                try {
                    const submission = App.submitQuiz(quizId, answers);
                    showAlert(`क्विज सफलतापूर्वक जमा कर दी गई! आपका स्कोर: ${submission.score}/${submission.total} (${submission.percentage}%)`, 'success');
                    renderStudentDashboard();
                } catch (err) {
                    showAlert(err.message, 'error');
                }
            };
            
            // Start timer (optional)
            let timeLeft = 20 * 60; // 20 minutes
            const timer = document.getElementById('quizTimer');
            
            const countdown = setInterval(function() {
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timer.textContent = '00:00';
                    // Auto submit when time is up
                    if (!answers.includes(null)) {
                        submitQuiz(quiz.id);
                    }
                } else {
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    timeLeft--;
                }
            }, 1000);
        }

        // Utility functions
        function escapeHtml(s) { 
            if (!s) return ''; 
            return String(s).replaceAll('<', '&lt;').replaceAll('>', '&gt;'); 
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('hi-IN', options);
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return '';
            const options = { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return new Date(timestamp).toLocaleDateString('hi-IN', options);
        }
        
        function getStatusText(status) {
            switch(status) {
                case 'scheduled': return 'शेड्यूल्ड';
                case 'ongoing': return 'चल रहा है';
                case 'completed': return 'समाप्त';
                default: return status;
            }
        }

        // Initialize the application
        App.init();
    </script>
